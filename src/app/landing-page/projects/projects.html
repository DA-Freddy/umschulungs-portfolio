@for(project of projectService.returnProjects(); track project.name){
<article class="project" [class]="project.finsihed?'finished':'in-work'">
    <h2>{{project.name}}</h2>
    <p>Dauer: {{project.duration}} Tage</p>
    <button><a [routerLink]="['/details', project.id]">{{project.name}}</a></button>
    
</article>
}
